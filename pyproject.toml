[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "bioutils-collection"
dynamic = ["version"]
description = "Comprehensive bioinformatics utilities for sequence analysis, alignment, annotation, and molecular biology workflows"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [
    { name = "Mykyta Forofontov" }
]
keywords = [
    "bioinformatics",
    "genomics",
    "sequence-analysis",
    "alignment",
    "fasta",
    "dna",
    "rna",
    "protein",
    "annotation",
    "molecular-biology",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]

dependencies = [
    "numpy>=2.3.0",
    "scipy>=1.15.0",
    "scikit-learn>=1.7.0",
    "numba>=0.60.0",
]

[project.urls]
Homepage = "https://github.com/MForofontov/bioutils-collection"
Repository = "https://github.com/MForofontov/bioutils-collection"
Issues = "https://github.com/MForofontov/bioutils-collection/issues"
Documentation = "https://github.com/MForofontov/bioutils-collection#readme"
Author Profile = "https://github.com/MForofontov"

[project.optional-dependencies]
dev = [
    "pytest==8.4.1",
    "pytest-asyncio==1.1.0",
    "pytest-cov==7.0.0",
    "mypy==1.17.1",
    "ruff",
    "attrs==25.3.0",
]

[tool.setuptools]
packages = { find = { where = ["."], include = ["bioutils_collection", "bioutils_collection.*"] } }

[tool.setuptools.dynamic]
version = {attr = "bioutils_collection._version.__version__"}

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["pytest/unit"]
markers = [
    "unit: marks tests as unit tests",
    "slow: marks tests as slow running tests",
    "alignment: tests for alignment_functions module",
    "annotation: tests for annotation_functions module",
    "clustering: tests for clustering_functions module",
    "data_validation: tests for data_validation module",
    "fasta: tests for fasta_misc module",
    "gc_functions: tests for gc_functions module",
    "motif: tests for motif_functions module",
    "repeat: tests for repeat_functions module",
    "restriction: tests for restriction_functions module",
    "sequence_operations: tests for sequence_operations module",
    "sequence_statistics: tests for sequence_statistics module",
    "translation: tests for translation_functions module",
]

[tool.ruff]
line-length = 88
target-version = "py310"
extend-exclude = ["venv", ".venv", "dist", "build", ".mypy_cache", ".ruff_cache"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "TID"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["bioutils_collection"]

[tool.ruff.format]
# Ruff is the formatter

[tool.mypy]
python_version = "3.10"
strict = true
explicit_package_bases = true
ignore_missing_imports = true
warn_unused_ignores = true
no_implicit_optional = true
pretty = true
cache_dir = ".mypy_cache"

[tool.coverage.run]
source = ["."]
omit = [
    "*/tests/*",
    "*/pytest/*",
    "*/__pycache__/*",
    "*/venv/*",
    "*/.venv/*",
    "*/build/*",
    "*/dist/*",
    "*/.eggs/*",
    "*.egg-info/*",
]
